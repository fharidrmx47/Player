<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sedang Diperbaiki</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #fff;
    background: linear-gradient(135deg, #0b1020, #1a1146, #0b1020);
    background-size: 300% 300%;
    animation: bg 12s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    overflow: hidden;
    position: relative;
  }
  @keyframes bg {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  /* bola cahaya di latar */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: .45;
    animation: melayang 9s ease-in-out infinite;
  }
  .orb.a { width: 260px; height: 260px; background: #ffb703; top: -60px; left: -60px; }
  .orb.b { width: 300px; height: 300px; background: #22d3ee; bottom: -80px; right: -80px; animation-delay: -4s; }
  @keyframes melayang {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(30px, 40px); }
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
    padding: 36px 26px 30px;
    text-align: center;
    background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(255, 255, 255, .18);
    border-radius: 28px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
  }

  /* roda gigi */
  .gears { position: relative; width: 170px; height: 120px; margin: 0 auto 22px; }
  .gears svg { position: absolute; }
  .g1 { width: 100px; height: 100px; left: 8px; top: 0; animation: putar 6s linear infinite; }
  .g2 { width: 74px; height: 74px; left: 88px; top: 52px; animation: putar 6s linear infinite reverse; }
  @keyframes putar { to { transform: rotate(360deg); } }

  .badge {
    display: inline-block;
    padding: 6px 14px;
    margin-bottom: 14px;
    font-size: .8rem;
    font-weight: 700;
    color: #ffb703;
    background: rgba(255, 183, 3, .15);
    border: 1px solid rgba(255, 183, 3, .5);
    border-radius: 999px;
  }
  h1 {
    font-size: clamp(1.6rem, 7vw, 2.1rem);
    font-weight: 800;
    line-height: 1.2;
    background: linear-gradient(90deg, #ffb703, #fff, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p {
    margin-top: 12px;
    font-size: 1rem;
    line-height: 1.6;
    color: rgba(255, 255, 255, .75);
  }

  /* progress bar */
  .bar {
    height: 10px;
    margin-top: 26px;
    background: rgba(255, 255, 255, .12);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar span {
    display: block;
    height: 100%;
    width: 40%;
    border-radius: 999px;
    background: linear-gradient(90deg, #ffb703, #22d3ee);
    animation: jalan 1.8s ease-in-out infinite;
  }
  @keyframes jalan {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(260%); }
  }
  .status { margin-top: 12px; font-size: .9rem; color: rgba(255, 255, 255, .6); }
  .dots::after {
    content: "";
    animation: titik 1.5s steps(4) infinite;
  }
  @keyframes titik {
    0% { content: ""; }
    25% { content: "."; }
    50% { content: ".."; }
    75% { content: "..."; }
  }

  button {
    margin-top: 26px;
    padding: 14px 30px;
    font-size: 1rem;
    font-weight: 700;
    color: #1a1146;
    background: linear-gradient(90deg, #ffb703, #ffd166);
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(255, 183, 3, .35);
  }
  button:active { transform: scale(.96); }
  button:focus-visible { outline: 3px solid #22d3ee; outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    body, .orb, .g1, .g2, .bar span, .dots::after { animation: none; }
    .bar span { width: 60%; }
  }
</style>
</head>
<body>
  <div class="orb a"></div>
  <div class="orb b"></div>

  <main class="card">
    <div class="gears" aria-hidden="true">
      <svg class="g1" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="38" fill="none" stroke="#ffb703" stroke-width="14" stroke-dasharray="10.9 9.9"/>
        <circle cx="50" cy="50" r="33" fill="#ffb703"/>
        <circle cx="50" cy="50" r="14" fill="#1a1146"/>
      </svg>
      <svg class="g2" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="38" fill="none" stroke="#22d3ee" stroke-width="14" stroke-dasharray="10.9 9.9"/>
        <circle cx="50" cy="50" r="33" fill="#22d3ee"/>
        <circle cx="50" cy="50" r="14" fill="#1a1146"/>
      </svg>
    </div>

    <span class="badge">&#9888; PERAWATAN SISTEM</span>
    <h1>Aplikasi ini sedang diperbaiki</h1>
    <p>Kami sedang meningkatkan aplikasi supaya lebih cepat dan nyaman dipakai. Segera kembali!</p>

    <div class="bar"><span></span></div>
    <div class="status">Sedang memperbaiki<span class="dots"></span></div>

    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
