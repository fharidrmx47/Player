name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Siapkan proyek
        run: |
          mkdir www
          cp index.html *.jpg *.mp3 www/
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share @capacitor-community/media
          npm i -D @capacitor/assets
          npx cap init "Fharid Rmx" com.fharid.player --web-dir=www
          npx cap add android
          mkdir assets
          cp icon.png assets/icon-only.png
          npx capacitor-assets generate --android --iconBackgroundColor '#080b11' --iconBackgroundColorDark '#080b11'
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Player-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
